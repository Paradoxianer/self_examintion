name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Wir nutzen 'any', um die aktuellste stabile Version zu erhalten, 
          # da dein Code Features von Flutter 3.27+ nutzt (.withValues).
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n || echo "No l10n to generate"

      - name: Build Web
        # Wir entfernen --web-renderer, da dies in neueren Versionen automatisch optimiert wird
        # und oft zu 'Exit Code 64' (Usage Error) führt.
        run: flutter build web --release --base-href "/self_examintion/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
